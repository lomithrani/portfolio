name: Release guard

# main is production: it only receives develop, through a release PR (see "Releases" in
# docs/DEPLOYMENT.md). This check fails any other pull request into main, and a release PR whose
# title does not name a new version ("Release v1.2.0"): the Release workflow tags the merge with
# it. It is a required status check of the main ruleset (.github/rulesets/main.json), so such a PR
# cannot be merged. Editing the title runs it again.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  develop-only:
    name: Only develop merges into main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" = "develop" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "Release PR from develop: allowed."
            exit 0
          fi
          echo "::error::Only develop can be merged into main. Open this PR against develop (Edit, next to the title, to change its base); it reaches main with the next release."
          exit 1
      - name: Check the version in the title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          version=$(printf '%s' "$PR_TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -z "$version" ]; then
            echo "::error::Name the version in the title, e.g. \"Release v1.2.0\": the merge is tagged with it."
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$version" > /dev/null 2>&1; then
            echo "::error::$version is already released: give this release a new version in the title."
            exit 1
          fi
          # Semantic versioning: one step after the latest release (none yet: any version)
          latest=$(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
            | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$latest" ]; then
            IFS=. read -r major minor patch <<< "${latest#v}"
            fix="v$major.$minor.$((patch + 1))"
            feature="v$major.$((minor + 1)).0"
            breaking="v$((major + 1)).0.0"
            case "$version" in
              "$fix" | "$feature" | "$breaking") ;;
              *)
                echo "::error::The latest release is $latest: the next one is $fix (fixes only), $feature (new features) or $breaking (breaking changes), not $version."
                exit 1
                ;;
            esac
          fi
          echo "This release will be published as $version${latest:+ (after $latest)}."

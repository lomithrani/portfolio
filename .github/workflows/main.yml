name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# A new push to a pull request cancels its superseded run. Pushes to develop/main are never
# cancelled: Railway's "Wait for CI" needs every deployed commit to finish its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint client
        run: bun run --cwd client lint
      - name: Type-check client (svelte-check)
        run: bun run --cwd client check
      - name: Type-check server
        run: bun run --cwd server typecheck
      - name: Build client (adapter-bun)
        run: bun run build:client

  test:
    name: Server and client unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    env:
      PORT: 3000
      MONGO_URL: mongodb://127.0.0.1:27017/portfolio-test
      JWT_SECRET: ci-jwt-secret
      ALLOWED_DOMAINS: '["http://localhost:4173"]'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Server tests
        run: bun run --cwd server test
      - name: Client unit tests
        run: bun run --cwd client test:unit

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/portfolio-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Start the API in the background
        run: nohup bun run start:server > api.log 2>&1 &
        env:
          PORT: 3000
          JWT_SECRET: ci-jwt-secret
          # Playwright serves the production build on :4173 (client/playwright.config.ts)
          ALLOWED_DOMAINS: '["http://localhost:4173"]'
      - name: Wait for the API health check
        run: >-
          curl --fail --silent --show-error --max-time 5
          --retry 30 --retry-delay 2 --retry-all-errors
          http://localhost:3000/health
          || { cat api.log; exit 1; }
      - name: Seed MongoDB
        run: bun run --cwd server seed
      - name: Install Playwright browser (chromium)
        run: cd client && bunx playwright install --with-deps chromium
      - name: Playwright tests
        run: bun run --cwd client test:e2e --reporter=list,html --trace=retain-on-failure
        env:
          PUBLIC_PORTFOLIO_API_URL: http://localhost:3000
      - name: Upload Playwright report and API log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
            api.log
          if-no-files-found: ignore
          retention-days: 7
